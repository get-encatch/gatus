# encatch: builds our image ghcr.io/get-encatch/gatus from a v*-encatch.* tag (see ENCATCH.md).
# Upstream's publish workflows (Docker Hub, ghcr.io/twin) are disabled in this fork.
name: encatch-publish
on:
  push:
    tags: ['v*-encatch.*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        # As upstream's test.yml: sudo because a test uses ping, with the configured go.
        run: sudo env "PATH=$PATH" "GOROOT=$GOROOT" go test ./... -race
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          # a manual run on a branch only builds (tag dry-run, not pushed)
          tags: ghcr.io/get-encatch/gatus:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dry-run' }}
          labels: |
            org.opencontainers.image.source=https://github.com/get-encatch/gatus
            org.opencontainers.image.description=Gatus with response-header conditions (TwiN/gatus#1825), for Encatch monitoring
